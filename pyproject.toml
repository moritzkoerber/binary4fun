[project]
name = "binary4fun"
description = "binary4fun is a small game, which tries to guess a number between 1 and 100 by binary search."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Moritz Körber"}]
keywords = ["game", "binary search"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3"
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/moritzkoerber/binary4fun"

[project.optional-dependencies]
tests = ["pytest", "sh"]

[project.scripts]
binary4fun = "binary4fun.__main__:main"

[build-system]
requires = ["setuptools>=40.8.0", "wheel", "setuptools_scm[toml]>=6.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/binary4fun/_version.py"

[tool.isort]
multi_line_output = 3
line_length = 88
include_trailing_comma = true
